[package]
name = "deepseek-workbench"
version = "0.1.0"
description = "Deepseek-only desktop coding workbench"
authors = ["yuye"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "deepseek_workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

